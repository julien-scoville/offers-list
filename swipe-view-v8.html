2:{c:['サークルアップに登録しているメールアドレスまたは電話番号と同じ情報でイベントに申し込みました。','en-courage運営事務局の社会人メンターとの面談が初めての場合のみ、<br>審査の対象となります。','イベント申込後30日以内に初回面談実施が確認できない場合、審査の対象外となります。','面接中はカメラをオンにし、積極的に参加することが大切です。'],
 h2:'en-courageへ移動してイベントに<br>申し込む',l2:['イベントに申し込む：<br>【26卒｜納得内定へのラストチャンス！】あなたにマッチする企業をご紹介！『キャリア面談サービス』','お申し込み時に選択した日時の面談に<br>ご参加ください。'],
 h3:'案件実施に使用したメアドを入力する',field:1,l3:['イベント応募完了後に使用したメールアドレスは、encourageアカウントの応募完了画面、またはプロフィールページでご確認いただけます。','使用したメールアドレスを入力いただくと、応募内容の確認がスムーズに行えます。']},
