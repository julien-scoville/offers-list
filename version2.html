<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポイント獲得</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--tile:#F4F5F7;--ink:#1B1D21;--sub:#7A7F89;--line:#DADDE3;--blue:#2F8CFF;--yellow:#FFE82B;--green:#62C61A;--chip:#fff;--sheet:#fff;--shade:rgba(20,22,26,.45);--outer:#E8EBEF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--outer:#0E0F11}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif;background:var(--outer);color:var(--ink);display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:480px){.app{height:min(900px,100dvh);margin:auto;border-radius:28px;box-shadow:0 8px 40px rgba(0,0,0,.14)}}
.screen{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);transition:transform .28s ease}
#earn{z-index:1;padding-bottom:120px}
#list{z-index:2;transform:translateX(100%)}#detail{z-index:3;transform:translateX(100%);display:flex;flex-direction:column}
.screen.on,#list.on,#detail.on{transform:none}
@media(prefers-reduced-motion:reduce){.screen,.sheet{transition:none}}
.pad{padding:0 20px}
h1{font-size:22px;font-weight:700;padding:24px 20px 4px;line-height:1.4;letter-spacing:.01em}
h2{font-size:17px;font-weight:700;line-height:1.4}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:16px}
.sec-h .l{display:flex;align-items:center;gap:6px}.sec-h .l svg{width:22px;height:22px}
.link{font-size:13px;font-weight:500;color:var(--blue);padding:6px 0 6px 8px}
.count{font-size:12px;color:var(--sub);margin-left:8px;font-weight:500}
/* nav grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.tile{background:#F5F6F8;border-radius:16px;min-height:84px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:500;color:#5B606A;line-height:1.3;text-align:center;transition:transform .12s,background .12s}
.tile:active{transform:scale(.97);background:#E9ECEF}
.tile svg{width:24px;height:24px}
/* cards */
.rail{display:flex;gap:14px;overflow-x:auto;padding:0 20px 8px;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.fcard{flex:0 0 min(276px,74vw);scroll-snap-align:start;text-align:left;display:block}
.bn{border-radius:16px;overflow:hidden;aspect-ratio:512/205;background:#EEF0F3}
.bn img{width:100%;height:100%;display:block;object-fit:cover}
.ttl{color:#828791;font-size:14px;font-weight:500;line-height:1.55;margin-top:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .ttl{min-height:42px}
.pts{display:flex;gap:16px;margin-top:12px}
.pt{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.pt i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:900 9px/1 'Noto Sans JP',sans-serif;font-style:normal;letter-spacing:-.2px}
.cp i{background:linear-gradient(145deg,#FFEF55,#FFD60A);color:#3D3000;box-shadow:inset 0 -1px 2px rgba(180,130,0,.28)}.mp i{background:linear-gradient(145deg,#52A8FF,#2380F5);color:#fff;box-shadow:inset 0 -1px 2px rgba(0,50,140,.28)}
.cards{display:flex;flex-direction:column;gap:32px;padding:0 20px}
.card{display:block;text-align:left;width:100%}
.card:active .bn{opacity:.85}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px 0 8px;border-radius:14px;font-size:12px;font-weight:500;border:1px solid #E3E6EB;background:var(--chip);color:#6A6F78;white-space:nowrap}
.tag svg{width:14px;height:14px;flex:none}
.tag.time{background:var(--blue);border-color:var(--blue);color:#fff}
.tag.circle{background:var(--green);border-color:var(--green);color:#fff}
.chip-on{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:16px;background:#EAF3FF;color:#1F6FD6;font-size:13px;font-weight:500;margin:0 20px 16px}
.chip-on b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:13px;line-height:1}
.empty{text-align:center;padding:48px 24px;color:var(--sub);font-size:13px;line-height:1.7}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.cards .ttl{font-size:12.5px;line-height:1.65}.cards .tag{height:26px;padding:0 11px 0 8px;font-size:11.5px;border-radius:13px}.cards .tag svg{width:13px;height:13px}.cards .pt{font-size:15px;gap:6px}.cards .pt i{width:20px;height:20px;font-size:7.5px}.tag{pointer-events:none;user-select:none;-webkit-user-select:none;cursor:inherit}.cards .pts{gap:14px}#detail .bar{flex:none}
.sp2{display:flex;align-items:center;gap:12px;margin:0 0 20px}.sp2 .lg2{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid #E3E6EB;display:grid;place-items:center;color:#D3D6DC}.sp2 .lg2 svg{width:16px;height:16px}.sp2 b{display:block;font-size:14px;font-weight:700;line-height:1.3}.sp2 small{font-size:11px;color:var(--sub)}.sp2>svg{margin-left:auto;width:16px;height:16px;color:#A5A9B1}
.d-hrow{display:flex;align-items:center;justify-content:space-between;margin:32px 0 16px}.d-hrow .d-h{margin:0}.d-tg{display:flex;flex-wrap:wrap;gap:6px}
.steps li b.coin{font-size:11px;font-weight:700;box-shadow:inset 0 0 0 4px var(--yellow),inset 0 0 0 5.5px #1B1D21}
.steps li:not(:last-child)::after{left:9px;top:auto;bottom:6px;width:0;height:0;background:none;border:5px solid transparent;border-top-color:#FFE82B;border-bottom-width:0}
.avs{margin-top:0}.avs i{background:#E3E6EB;color:#6F7480;font-weight:500;font-size:11px;border:2px solid #fff;display:block;text-align:left;padding-left:4px;line-height:28px;overflow:hidden;white-space:nowrap}
.desc{white-space:pre-line}
/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:center;height:60px;background:var(--bg);font-size:16px;font-weight:700}
.back{position:absolute;left:16px;top:10px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14);display:grid;place-items:center}
.back svg{width:20px;height:20px;transform:rotate(180deg)}
.lst-pad{padding:16px 0 56px}
/* bottom nav */
.nav{position:absolute;z-index:4;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:64px;border-radius:32px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(20,22,26,.10),0 0 0 1px rgba(20,22,26,.05);display:flex;padding:6px;transition:transform .28s}
.nav.off{transform:translateY(120px)}
.nav button{flex:1;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:#7A7F89}
.nav button.act{background:#EEF0F3;color:#1B1D21;font-weight:700}
.nav svg{width:24px;height:24px}
/* sheet */
.shade{position:absolute;inset:0;z-index:10;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:11;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--sheet);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#E1E4E8;margin:0 auto 14px}
.sheet h3{font-size:17px;font-weight:700;text-align:center;margin-bottom:20px}
.sh-x{position:absolute;right:16px;top:20px;width:28px;height:28px;border-radius:50%;background:#868B95;color:#fff;font-size:16px;line-height:1}
.sh-l{font-size:15px;font-weight:700;margin:6px 0 12px}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:0 16px;height:60px;border-radius:14px;background:var(--tile);margin-bottom:10px;text-align:left;font-size:14px;font-weight:500;color:#555A63}
.row svg.ic{width:26px;height:26px}
.row .ch{margin-left:auto;width:16px;height:16px;color:#A5A9B1}
.row .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid #C3C7CE;display:grid;place-items:center;background:#fff}
.row[aria-checked=true]{background:#EAF3FF;box-shadow:inset 0 0 0 1.5px var(--blue);color:#1B1D21}
.row[aria-checked=true] .ck{background:var(--blue);border-color:var(--blue)}
.row .ck svg{width:14px;height:14px;opacity:0}.row[aria-checked=true] .ck svg{opacity:1}
.acts{display:flex;gap:10px;margin-top:20px}
.btn{height:52px;border-radius:26px;font-size:15px;font-weight:700}
.btn.sec2{flex:0 0 108px;background:var(--tile);color:#555A63}
.btn.pri{flex:1;background:var(--yellow);color:#1B1D21}
/* detail */
.d-pad{padding:0 20px 32px;flex:1 0 auto}
.d-ttl{font-size:16px;font-weight:700;line-height:1.6;margin:16px 0 20px}
.pbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb{border-radius:16px;padding:14px 16px}.pb.y{background:#FFF8D6}.pb.b{background:#EAF4FF}
.pb small{display:flex;justify-content:space-between;font-size:11px;font-weight:500;margin-bottom:4px}
.pb.y small{color:#B7860B}.pb.b small{color:#2F8CFF}
.pb small u{width:16px;height:16px;border-radius:50%;text-decoration:none;color:#fff;display:grid;place-items:center;font-size:10px}
.pb.y small u{background:#F2B21B}.pb.b small u{background:#58A4FF}
.pb strong{font-size:20px;font-weight:700}
.spon{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:12px;padding:14px;margin-top:16px}
.spon span.lg{width:36px;height:36px;border-radius:50%;background:#14224D;color:#fff;display:grid;place-items:center;font:italic 700 11px 'Noto Sans JP',sans-serif}
.spon b{display:block;font-size:14px}.spon small{font-size:11px;color:var(--sub)}
.spon svg{margin-left:auto;width:16px;height:16px;color:#A5A9B1}
.d-h{font-size:15px;font-weight:700;margin:32px 0 16px}
.box{background:var(--tile);border-radius:16px;padding:20px}
.box h4{font-size:12px;font-weight:700;margin-bottom:8px}
.box hr{border:0;border-top:1px solid #E1E4E8;margin:14px 0}
.mem{display:flex;align-items:center;justify-content:space-between}
.avs{display:flex;margin-top:8px}.avs i{width:32px;height:32px;border-radius:50%;border:2px solid var(--tile);margin-right:-6px;display:grid;place-items:center;font:500 11px 'Noto Sans JP';font-style:normal;color:#fff}
.steps{list-style:none;padding:0}
.steps li{display:flex;gap:14px;align-items:center;font-size:13px;color:#4A4F58;padding-bottom:18px;position:relative;line-height:1.5}
.steps li:last-child{padding-bottom:0}
.steps li b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:12px;color:#1B1D21;z-index:1}
.steps li:not(:last-child)::after{content:'';position:absolute;left:13px;top:28px;bottom:0;width:2px;background:#FFF2A0}
.desc{font-size:13px;line-height:1.8;color:#4A4F58}.desc p{margin-bottom:16px}.desc strong{color:var(--ink);display:block}
.foot{position:sticky;z-index:6;bottom:0;flex:none;margin-top:auto;display:flex;align-items:center;gap:16px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),#fff 28%)}
.foot .sh{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sub);min-width:48px;white-space:nowrap}
.foot .sh svg{width:24px;height:24px;color:var(--blue)}
.foot .btn{flex:1}
</style></head><body>

function openDetail(id){

 <div class="pbox"><div class="pb y"><small>団体ポイント<u>?</u></small><strong>${num(d.gp)}円</strong></div><div class="pb b"><small>個人ポイント<u>?</u></small><strong>${num(d.pp)}円</strong></div></div>
 <h3 class="d-h">対象者</h3><div class="d-tg"><span class="tag">${ic(gi)}${gl}</span>${o.y.map(y=>`<span class="tag">${ic('cap')}${y}</span>`).join('')}</div>
 ${d.steps?`<h3 class="d-h">ポイント獲得方法</h3><ol class="steps">${d.steps.map((s,i)=>`<li><b>${i+1}</b>${s.replace('\n','<br>')}</li>`).join('')}<li><b class="coin">¥</b>ポイントが付与される！</li></ol>`:''}
 ${d.mem?`<div class="d-hrow"><h3 class="d-h">同じサークルの申込者 (${d.mem}人)</h3><span class="link" style="padding:0">一覧を見る</span></div><div class="avs">${NAMES.map(n=>`<i>${n}</i>`).join('')}</div>`:''}
 <h3 class="d-h">オファー概要</h3><div class="desc">${fmt(d.desc)}</div></div>
 <div class="foot"><button class="sh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M5 11v8h14v-8"/></svg>共有する</button><button class="btn pri">次へ</button></div>`;
 $('#detail').scrollTop=0;push('detail');
}
const stack=[];
function push(id){stack.push(id);$('#'+id).classList.add('on');nav()}
function back(){const id=stack.pop();if(id)$('#'+id).classList.remove('on');nav()}
function nav(){$('#nav').classList.toggle('off',stack.length>0)}

function sheet(html){$('#sheet').innerHTML=html;$('#shade').classList.add('on');$('#sheet').classList.add('on')}
function closeSheet(){$('#shade').classList.remove('on');$('#sheet').classList.remove('on')}
const CATS=['クレジット・カード'];
function filterSheet(){
 S.draft=[...S.cats];
 sheet(`<div class="grab"></div><h3>カテゴリーで絞り込む</h3>
 ${CATS.map(c=>`<button class="row" role="checkbox" aria-checked="${S.draft.includes(c)}" data-opt="${c}">${ic('card','ic')}${c}<span class="ck"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.500l3.200 3L13 4.500"/></svg></span></button>`).join('')}
 <div class="acts"><button class="btn sec2" data-clear>クリア</button><button class="btn pri" data-apply>この条件で探す</button></div>`);
}
function moreSheet(){
 const r=(k,n,l)=>`<button class="row" data-go="${k}">${ic(n,'ic')}${l}${ic('chev','ch')}</button>`;
 sheet(`<div class="grab"></div><h3>もっと見る</h3><button class="sh-x" data-close aria-label="閉じる">×</button>
 <div class="sh-l">かんたん検索</div>${r('member','users','メンバーが参加中')}${r('high','coin','高報酬')}${r('t5','time','5分以内')}
 <div class="sh-l" style="margin-top:24px">利用できるカテゴリーから探す</div>${r('career','bag','就活・採用')}${r('credit','card','クレジット・カード')}${r('app','app','アプリ・オンラインサービス')}${r('shop','shop','ショッピング・商品')}`);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-id],[data-go],[data-back],[data-rm],[data-opt],[data-clear],[data-apply],[data-close]');
 if(!t&&e.target.id==='shade')return closeSheet();
 if(!t)return;
 if(t.dataset.id)return openDetail(t.dataset.id);
 if(t.dataset.go){const k=t.dataset.go;
  if(k==='filter')return filterSheet();
  if(k==='more')return moreSheet();
  closeSheet();return openList(k)}
 if('back' in t.dataset)return back();
 if(t.dataset.rm){S.cats=S.cats.filter(c=>c!==t.dataset.rm);return renderEarn()}
 if(t.dataset.opt){const c=t.dataset.opt,i=S.draft.indexOf(c);i<0?S.draft.push(c):S.draft.splice(i,1);t.setAttribute('aria-checked',i<0);return}
 if('clear' in t.dataset){S.draft=[];S.cats=[];document.querySelectorAll('[data-opt]').forEach(b=>b.setAttribute('aria-checked','false'));closeSheet();return renderEarn()}
 if('apply' in t.dataset){S.cats=[...S.draft];closeSheet();return renderEarn()}
 if('close' in t.dataset)closeSheet();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.dataset.rm){e.preventDefault();e.target.click()}});
renderEarn();
</script></body></html>
